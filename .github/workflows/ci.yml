# Host checks that need no VM, kernel build or site-generated image.  The
# fuzzing lane itself (kernel, syzkaller, guest images) is run by hand.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nfs-proxy:
    # Normalizer and rfc_xdr tests, RFC pins and table freshness (offline),
    # clang build plus gcc ASan/UBSan build, every host unit test.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: tools/nfs-proxy/build.sh

  agent-pipeline:
    # Stage 1 Controller (agent_pipeline/), against uv.lock.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Tests are per-test tmp_path isolated; setup dominates, so xdist scales.
      - run: uv run pytest -q -n auto

  syzkaller-bridge:
    # Build the parser from this checkout; bridge-backed tests must not pass
    # against a locally pinned binary built from different Go sources.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - run: uv sync --locked
      - name: Fetch syzkaller at the pinned base
        run: |
          commit=$(sed -n 's/^syzkaller_commit=//p' bundle/patches/BASE)
          git init -q "$RUNNER_TEMP/syzkaller"
          git -C "$RUNNER_TEMP/syzkaller" fetch -q --depth 1 \
            https://github.com/google/syzkaller.git "$commit"
          git -C "$RUNNER_TEMP/syzkaller" checkout -q FETCH_HEAD
      - name: Build and test the pinned parser bridge
        run: |
          uv run python tools/syzkaller/build.py \
            --source "$RUNNER_TEMP/syzkaller" \
            --output "$RUNNER_TEMP/syz-bridge" --go "$(command -v go)"
          KNFSD_SYZ_BUNDLE="$RUNNER_TEMP/syz-bridge/bundle" \
            uv run pytest -q -n auto tests/agent_pipeline/syzkaller

  lane-inputs:
    # Lane dependency assembly and bake inputs, and the lane script's
    # quoted sh -c region, without booting a guest.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test-lane-inputs.py
      - run: sh tools/lane-quote-lint.sh

  syzkaller-patches:
    # The checked-in syzkaller series applies to its pinned base, and the
    # executor and flatrpc tests the series carries pass: the S1a activation
    # barrier against a test double of the proxy endpoint, and where the
    # executor places it, and the S1c crash context syz-manager keeps.  The barrier against the real Proxy is
    # tests/agent_pipeline/test_executor_activation.py.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@localhost
    steps:
      - uses: actions/checkout@v4
      - name: Fetch syzkaller at the pinned base
        run: |
          commit=$(sed -n 's/^syzkaller_commit=//p' bundle/patches/BASE)
          git init -q "$RUNNER_TEMP/syzkaller"
          git -C "$RUNNER_TEMP/syzkaller" fetch -q --depth 1 \
            https://github.com/google/syzkaller.git "$commit"
          git -C "$RUNNER_TEMP/syzkaller" checkout -q FETCH_HEAD
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/syzkaller/go.mod
          cache: false
      - run: tools/fport-apply.sh syzkaller "$RUNNER_TEMP/syzkaller"
      - name: Executor and flatrpc tests
        working-directory: ${{ runner.temp }}/syzkaller
        run: |
          make descriptions
          make executor
          ./bin/linux_amd64/syz-executor test test_nfsp_sha256
          ./bin/linux_amd64/syz-executor test test_nfsp_barrier
          ./bin/linux_amd64/syz-executor test test_nfsp_broker
          ./bin/linux_amd64/syz-executor test test_nfsp_cgroup
          # The Linux-only NFS proxy code must not leak into other executor
          # targets; the test OS executor is built by syzkaller's own tests.
          TARGETOS=test TARGETARCH=64 TARGETVMARCH=64 make executor
          go test ./pkg/flatrpc/
          go test ./executor/ -run 'NfsProxy|Generation|FixedLane'
          # S1c: the crash log keeps each record's lane and barrier (0024).
          go test ./pkg/rpcserver/ -run 'LastExecuting|NfsProxy|PrependExecuting|ProgramTimeout'
          # A program longer than the slowdown default keeps its remote
          # coverage only with -program-timeout (0029).
          go test ./pkg/runtest/ -run 'ProgramTimeout'
          go test ./tools/syz-execprog/
          go test ./pkg/mgrconfig/
