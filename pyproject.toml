[project]
name = "knfsd-syzkaller"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
agent-runtime = ["pydantic-ai-slim==2.55.0"]
agent-openai = ["pydantic-ai-slim[openai]==2.55.0"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "pydantic-ai-slim[openai]==2.55.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
